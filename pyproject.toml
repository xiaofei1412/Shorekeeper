[project]
name = "shorekeeper"
version = "0.1.0"
description = "Local process health and unavailable-capability API for M01A"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.163.1",
    "pydantic==2.14.3",
    "uvicorn==0.54.0",
]

[dependency-groups]
test = ["pytest==9.2.0", "httpx==0.28.1"]

[build-system]
requires = ["uv_build==0.13.8"]
build-backend = "uv_build"

[tool.uv]
cache-dir = "local/cache/uv"
python-preference = "only-managed"

[tool.pytest.ini_options]
testpaths = ["tests"]
